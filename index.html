        if (parsed.date === '') {
          const date = parseDateLine(line);
          if (date !== '') {
            parsed.date = date;
            return;
          }
        }

        const song = parseSongLine(line);
        if (song !== null && song.title !== '') {
          if (song.section === 'oa') {
            oaSongs.push(song.title);
          } else if (song.section === 'en') {
            enSongs.push(song.title);
          } else {
            mainSongs.push(song.title);
          }
        }
      });

      parsed.setlist = oaSongs.concat(mainSongs, enSongs);
      parsed.oaCount = oaSongs.length;
      parsed.enCount = enSongs.length;

      return parsed.setlist.length > 0 ? parsed : null;
    }

    // ============================================================
    // Clipboard Service: 生成テキストのコピー（ClipboardService）
    // ------------------------------------------------------------
    // copyToClipboard は成否を Promise<boolean> で解決する純粋責務。
    // 例外は内部で握りつぶし、呼び出し側へ漏らさない（成否は真偽値で返す）。
    // 二段フォールバック（design ClipboardService / Requirements 5.5–5.7）:
    //   1) navigator.clipboard.writeText（セキュアコンテキストの第一候補）
    //   2) 隠し <textarea> + document.execCommand('copy')（file:// 等の代替）
    // 成否通知（トースト）の表示判断・結線は呼び出し側（後続 4.1）の責務。
    // ============================================================

    /**
     * 隠し <textarea> と document.execCommand('copy') でクリップボードへコピーする
     * フォールバック実装（Clipboard API が未対応／失敗した場合に使用）。
     * 生成した textarea は成否に関わらず必ず除去する。例外時は false を返す。
     * @param {string} text コピーする文字列
     * @returns {boolean} コピー成功で true、失敗・例外で false
     */
    function copyViaExecCommand(text) {
      let textarea = null;
      try {
        textarea = document.createElement('textarea');
        textarea.value = text;
        // 画面外かつ操作不能に配置し、レイアウト・スクロール・ズームへ影響させない。
        textarea.setAttribute('readonly', '');
        textarea.setAttribute('aria-hidden', 'true');
        textarea.tabIndex = -1;
        textarea.style.position = 'fixed';
        textarea.style.top = '0';
        textarea.style.left = '0';
        textarea.style.width = '1px';
        textarea.style.height = '1px';
        textarea.style.padding = '0';
        textarea.style.border = 'none';
        textarea.style.outline = 'none';
        textarea.style.boxShadow = 'none';
        textarea.style.background = 'transparent';
        textarea.style.opacity = '0';

        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        // iOS Safari など select() が効きにくい環境向けに範囲選択も併用。
        if (typeof textarea.setSelectionRange === 'function') {
          textarea.setSelectionRange(0, text.length);
        }

        const succeeded = document.execCommand('copy');
        return succeeded === true;
      } catch (err) {
        return false;
      } finally {
        if (textarea && textarea.parentNode) {
          textarea.parentNode.removeChild(textarea);
        }
      }
    }

    /**
     * 生成テキストをクリップボードへコピーする（Requirements 5.5–5.7）。
     * まず Clipboard API（navigator.clipboard.writeText）を試行し、未対応または
     * 失敗時は textarea + execCommand フォールバックへ降格する。いずれも失敗した
     * 場合は false を返す。例外は内部で握り、呼び出し側へは真偽値のみを返す。
     * @param {string} text コピーする文字列
     * @returns {Promise<boolean>} 成功で true、最終的に失敗で false
     */
    async function copyToClipboard(text) {
      const value = typeof text === 'string' ? text : String(text == null ? '' : text);

      // 1) Clipboard API（セキュアコンテキストの第一候補）。
      if (
        typeof navigator !== 'undefined' &&
        navigator.clipboard &&
        typeof navigator.clipboard.writeText === 'function'
      ) {
        try {
          await navigator.clipboard.writeText(value);
          return true;
        } catch (err) {
          // 権限拒否・非セキュアコンテキスト等。フォールバックへ降格する。
        }
      }

      // 2) textarea + execCommand フォールバック（file:// 等）。
      return copyViaExecCommand(value);
    }

    /**
     * トースト要素（1.1 で用意済みの #toast / data-role="toast"）へメッセージを
     * 表示する補助ヘルパ（任意）。表示時間後に自動で隠す。要素が無ければ何もしない。
     * copyToClipboard 自体の責務（boolean を返す）には影響しない。
     * @param {string} message 表示する通知文
     * @param {number} [durationMs=2400] 表示継続時間（ミリ秒）
     * @returns {void}
     */
    let toastHideTimer = null;
    function showToast(message, durationMs) {
      const toast = document.getElementById('toast');
      if (!toast) {
        return;
      }
      const duration = typeof durationMs === 'number' && durationMs > 0 ? durationMs : 2400;
      toast.textContent = message;
      toast.hidden = false;
      if (toastHideTimer !== null) {
        clearTimeout(toastHideTimer);
      }
      toastHideTimer = setTimeout(function () {
        toast.hidden = true;
        toastHideTimer = null;
      }, duration);
    }

    // ============================================================
    // Render: state→DOM 反映（Renderer）
    // ------------------------------------------------------------
    // 描画関数は state を読み取るのみで state を書き換えない。
    // 状態変更はミューテータ経由→その後 renderAll() を呼ぶ設計。
    // 通し番号の同期は差分描画ではなく全再描画で保証する（2.4, 4.2）。
    // XSS回避のため曲名は textContent で挿入する。
    // ============================================================

    /**
     * セトリ1行分の <tr> を生成する。
     * 各行に ①並び替えハンドル ②通し番号(index+1) ③曲名(非編集) ④削除ボタン を描画。
     * @param {string} title 曲タイトル
     * @param {number} index 0起算インデックス（通し番号は index+1、削除同定にも使用）
     * @returns {HTMLTableRowElement}
     */
    /**
     * 区分の境界行を作る。ラベル（O.A ここまで／ここからアンコール）と、
     * 境界を1曲ぶん上下へ動かすボタンを持つ。曲の並びは動かさない。
     * @param {'oa'|'en'} kind どちらの境界か
     * @returns {HTMLTableRowElement} 境界行
     */
    function createSectionDividerRow(kind) {
      const row = document.createElement('tr');
      row.className = 'setlist__divider';
      row.dataset.role = 'section-divider';
      row.dataset.section = kind;

      const cell = document.createElement('td');
      cell.colSpan = 4;

      const inner = document.createElement('div');
      inner.className = 'setlist__divider-inner';

      const label = document.createElement('span');
      label.className = 'setlist__divider-label';
      label.textContent = kind === 'oa' ? 'O.A ここまで' : 'ここからアンコール';

      const line = document.createElement('span');
      line.className = 'setlist__divider-line';

      // 本編の曲が残っている場合だけ、境界を本編側へ広げられる。
      const canGrow = state.oaCount + state.enCount < state.setlist.length;

      const upButton = document.createElement('button');
      upButton.type = 'button';
      upButton.className = 'setlist__divider-move';
      upButton.dataset.role = 'divider-up';
      upButton.textContent = '▲';
      const downButton = document.createElement('button');
      downButton.type = 'button';
      downButton.className = 'setlist__divider-move';
      downButton.dataset.role = 'divider-down';
      downButton.textContent = '▼';

      if (kind === 'oa') {
        upButton.disabled = state.oaCount === 0;
        upButton.setAttribute('aria-label', 'O.A を1曲減らす');
        upButton.addEventListener('click', function () {
          setOaCount(state.oaCount - 1);
          renderAll();
        });
        downButton.disabled = !canGrow;
        downButton.setAttribute('aria-label', 'O.A を1曲増やす');
        downButton.addEventListener('click', function () {
          setOaCount(state.oaCount + 1);
          renderAll();
        });
      } else {
        upButton.disabled = !canGrow;
        upButton.setAttribute('aria-label', 'アンコールを1曲増やす');
        upButton.addEventListener('click', function () {
          setEnCount(state.enCount + 1);
          renderAll();
        });
        downButton.disabled = state.enCount === 0;
        downButton.setAttribute('aria-label', 'アンコールを1曲減らす');
        downButton.addEventListener('click', function () {
          setEnCount(state.enCount - 1);
          renderAll();
        });
      }

      inner.appendChild(label);
      inner.appendChild(line);
      inner.appendChild(upButton);
      inner.appendChild(downButton);
      cell.appendChild(inner);
      row.appendChild(cell);
      return row;
    }

    function createSetlistRow(title, index) {
      const position = setlistPosition(index, state.oaCount, state.enCount, state.setlist.length);
      const noLabel = setlistNoLabel(position);
      const row = document.createElement('tr');
      row.className = 'setlist__row';
      row.dataset.index = String(index);

      // ① 並び替えハンドル（スワイプ用の掴み要素。実スワイプ配線は後続3.3）
      const handleCell = document.createElement('td');
      handleCell.className = 'setlist__col--handle';
      const handle = document.createElement('span');
      handle.className = 'setlist__handle';
      handle.dataset.role = 'reorder-handle';
      handle.setAttribute('aria-label', '並べ替え');
      handle.textContent = '☰'; // ☰ ハンバーガー（掴み目印）
      handleCell.appendChild(handle);

      // スワイプ並び替えの Pointer Events を当該ハンドルへ結線（3.3）。
      // 行生成のたびに新規要素へ張るため二重結線にはならない。
      attachReorderHandlers(handle, row);

      // ② 通し番号（1起算 = index+1）
      const noCell = document.createElement('td');
      noCell.className = 'setlist__col--no';
      noCell.textContent = noLabel; // O.A 1 ／ 1 ／ En.1

      // ③ 曲名（非編集の表示テキスト。input要素にしない / textContentで挿入）
      const titleCell = document.createElement('td');
      titleCell.className = 'setlist__col--title';
      const titleText = document.createElement('span');
      titleText.className = 'setlist__title';
      titleText.textContent = title;
      titleCell.appendChild(titleText);

      // ④ 行ごとのタップ式削除ボタン（実処理配線の本体は後続3.2）
      const removeCell = document.createElement('td');
      removeCell.className = 'setlist__col--remove';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'setlist__remove';
      removeBtn.dataset.role = 'remove-button';
      removeBtn.dataset.index = String(index);
      removeBtn.setAttribute('aria-label', noLabel + ' を削除');
      removeBtn.textContent = '削除';
      removeBtn.addEventListener('click', function () {
        removeSongAt(index);
        renderAll();
      });
      removeCell.appendChild(removeBtn);

      row.appendChild(handleCell);
      row.appendChild(noCell);
      row.appendChild(titleCell);
      row.appendChild(removeCell);
      return row;
    }

    /**
     * 空状態の <tr>（プレースホルダ行）を生成する。
     * @returns {HTMLTableRowElement}
     */
    function createEmptyRow() {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.className = 'setlist__empty';
      cell.colSpan = 4;
      cell.textContent = '曲が追加されていません';
      row.appendChild(cell);
      return row;
    }

    /**
     * state.setlist をセトリ表 (<tbody data-role="setlist-body">) へ全再描画する。
     * 通し番号は配列順の連番（index+1）へ常に同期される。
     * @returns {void}
     */
    /**
     * 属性チップ（ワンマン・生誕など）を描画する。押下状態は aria-pressed で持つ。
     * 項目はマスタ順に固定なので、状態が変わるたびに作り直して構わない。
     * @returns {void}
     */
    function renderTagChips() {
      const list = document.getElementById('tag-list');
      if (!list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存のチップとリスナを捨てる）

      const fragment = document.createDocumentFragment();
      TAG_MASTER.forEach(function (tag) {
        const selected = state.tags.indexOf(tag.id) !== -1;

        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'tag-chip';
        chip.dataset.role = 'tag-chip';
        chip.dataset.tagId = String(tag.id);
        chip.textContent = tag.name; // textContent で挿入（XSS安全）
        chip.setAttribute('aria-pressed', selected ? 'true' : 'false');
        chip.addEventListener('click', function () {
          toggleTag(tag.id);
          renderAll(); // 再描画＋作業中データの保存
        });

        fragment.appendChild(chip);
      });
      list.appendChild(fragment);
    }

    /**
     * 「＋O.A」「＋アンコール」ボタンの出し入れを状態に合わせる。
     * すでにその区分がある場合は境界行の▲▼で動かすので、ボタンは隠す。
     * 曲が1曲も無い／本編の曲が残らない場合も隠す。
     * @returns {void}
     */
    function syncSectionTools() {
      const tools = document.getElementById('setlist-tools');
      const addOa = document.getElementById('btn-add-oa');
      const addEn = document.getElementById('btn-add-en');
      if (!tools || !addOa || !addEn) {
        return;
      }
      const canGrow = state.oaCount + state.enCount < state.setlist.length;
      addOa.hidden = state.oaCount > 0 || !canGrow;
      addEn.hidden = state.enCount > 0 || !canGrow;
      tools.hidden = addOa.hidden && addEn.hidden;
    }

    /**
     * 「＋O.A」「＋アンコール」の結線（冪等）。押すとその区分を1曲ぶん作る。
     * @returns {void}
     */
    let sectionToolsWired = false;
    function initSectionTools() {
      if (sectionToolsWired) {
        return;
      }
      const addOa = document.getElementById('btn-add-oa');
      const addEn = document.getElementById('btn-add-en');
      if (addOa) {
        addOa.addEventListener('click', function () {
          setOaCount(state.oaCount + 1); // 先頭の1曲を O.A にする
          renderAll();
        });
      }
      if (addEn) {
        addEn.addEventListener('click', function () {
          setEnCount(state.enCount + 1); // 末尾の1曲をアンコールにする
          renderAll();
        });
      }
      sectionToolsWired = true;
    }

    function renderSetlist() {
      syncSectionTools();
      const body = document.getElementById('setlist-body');
      if (!body) {
        return;
      }
      body.textContent = ''; // 既存行をクリア（全再描画）

      if (state.setlist.length === 0) {
        body.appendChild(createEmptyRow());
        return;
      }

      const fragment = document.createDocumentFragment();
      const length = state.setlist.length;
      state.setlist.forEach(function (title, index) {
        // O.A の下端・アンコールの上端に境界行を差し込む。
        if (state.oaCount > 0 && index === state.oaCount) {
          fragment.appendChild(createSectionDividerRow('oa'));
        }
        if (state.enCount > 0 && index === length - state.enCount) {
          fragment.appendChild(createSectionDividerRow('en'));
        }
        fragment.appendChild(createSetlistRow(title, index));
      });
      body.appendChild(fragment);
    }

    /**
     * 全体描画のエントリポイント。状態変更後に呼び出す。
     * 現状はセトリ表のみ。後続タスクで他領域の描画を集約する。
     * @returns {void}
     */
    function renderAll() {
      renderTagChips();
      renderSetlist();
      saveState(); // 状態変更のたびに保存（間違って閉じても直前の内容を復元できる）
    }

    // ============================================================
    // Reorder Controller: ハンドルのスワイプによる行の並び替え（ReorderController）
    // ------------------------------------------------------------
    // 責務（Requirements 4.1, 4.2, 4.4 / design ReorderController, research「スワイプ」）:
    //   - 並び替えハンドル上の Pointer Events（pointerdown/move/up + setPointerCapture）で
    //     対象行を縦方向にドラッグし、縦移動量から挿入位置を算出して state.setlist 内で移動。
    //   - 確定（pointerup/cancel）時に renderAll() で全再描画し通し番号を同期する（4.2）。
    //   - ハンドルには CSS で touch-action:none を付与済み（スクロール競合回避）。
    //   - タップ/スワイプで完結（4.4）。pointer type=mouse でも同一経路で動作する。
    // 状態変更は moveSetlistItem ミューテータ経由のみ。描画中に直接DOM順は変えず、
    // ドラッグ中は視覚フィードバック（行ハイライト）のみ行い、真実は常に state.setlist。
    // 結線は createSetlistRow からの attachReorderHandlers で行ごとに新規要素へ張るため
    // 二重結線は発生しない（全再描画で古い行とリスナは破棄される）。
    // ============================================================

    /**
     * 進行中ドラッグの一時状態。1本のポインタのみ追跡する。
     * @type {{
     *   pointerId: number,
     *   handle: HTMLElement,
     *   row: HTMLTableRowElement,
     *   startIndex: number,
     *   currentIndex: number,
     *   startClientY: number
     * } | null}
     */
    let activeDrag = null;

    /**
     * 挿入位置を示す水色ライン要素（DropIndicator）。初回利用時に生成し body 直下へ置く。
     * ドラッグ中のみ表示し、確定/中断で hideInsertionIndicator により隠す。
     * @type {HTMLElement | null}
     */
    let insertionIndicator = null;

    /**
     * 挿入ラインの要素を返す（未生成なら生成して body へ追加）。
     * @returns {HTMLElement}
     */
    function getInsertionIndicator() {
      if (!insertionIndicator) {
        insertionIndicator = document.createElement('div');
        insertionIndicator.className = 'reorder-indicator';
        insertionIndicator.setAttribute('aria-hidden', 'true');
        insertionIndicator.style.display = 'none';
        document.body.appendChild(insertionIndicator);
      }
      return insertionIndicator;
    }

    /**
     * ポインタの現在Y座標から、挿入ラインを描くべき境界（行間）のviewport Y座標を返す。
     * 各行の垂直中心と比較し、中心より上に来た最初の行の上端を境界とする。
     * どの中心よりも下なら最終行の下端を境界とする。ドラッグ中の行自身も基準に含める
     * （視覚的な「隙間」をそのまま示すため）。
     * @param {number} clientY ポインタの現在 clientY
     * @param {HTMLTableRowElement[]} rows 並び替え可能な行配列
     * @returns {number} 境界の viewport Y 座標
     */
    function computeInsertionBoundaryY(clientY, rows) {
      for (let i = 0; i < rows.length; i++) {
        const rect = rows[i].getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        if (clientY < center) {
          return rect.top;
        }
      }
      const lastRect = rows[rows.length - 1].getBoundingClientRect();
      return lastRect.bottom;
    }

    /**
     * ドラッグ中の挿入位置に水色ラインを表示・再配置する。
     * @param {number} clientY ポインタの現在 clientY
     * @returns {void}
     */
    function showInsertionIndicator(clientY) {
      const rows = getReorderRows();
      if (rows.length === 0) {
        hideInsertionIndicator();
        return;
      }
      const table = document.getElementById('setlist-table');
      const bounds = table
        ? table.getBoundingClientRect()
        : rows[0].getBoundingClientRect();
      const boundaryY = computeInsertionBoundaryY(clientY, rows);

      const indicator = getInsertionIndicator();
      const half = indicator.offsetHeight / 2 || 1.5;
      indicator.style.display = 'block';
      indicator.style.left = bounds.left + 'px';
      indicator.style.width = bounds.width + 'px';
      indicator.style.top = (boundaryY - half) + 'px';
    }

    /**
     * 挿入ラインを非表示にする。
     * @returns {void}
     */
    function hideInsertionIndicator() {
      if (insertionIndicator) {
        insertionIndicator.style.display = 'none';
      }
    }

    /**
     * セトリ表本体（tbody）内の並び替え可能な行要素を配列で返す。
     * 空状態のプレースホルダ行は data-index を持たないため除外される。
     * @returns {HTMLTableRowElement[]}
     */
    function getReorderRows() {
      const body = document.getElementById('setlist-body');
      if (!body) {
        return [];
      }
      return Array.prototype.slice.call(
        body.querySelectorAll('tr.setlist__row[data-index]')
      );
    }

    /**
     * ポインタの現在Y座標から、ドラッグ対象の挿入先インデックスを算出する。
     * 各行の垂直中心と比較し、現在位置が中心より上にある最初の行の位置を挿入先とする。
     * すべての行の中心より下なら末尾（length-1）を返す。
     * @param {number} clientY ポインタの現在 clientY
     * @param {number} draggingIndex ドラッグ中要素の現在インデックス（自身は判定から除外）
     * @returns {number} 0起算の挿入先インデックス
     */
    function computeTargetIndex(clientY, draggingIndex) {
      const rows = getReorderRows();
      const lastIndex = rows.length - 1;
      if (lastIndex < 0) {
        return draggingIndex;
      }
      for (let i = 0; i < rows.length; i++) {
        if (i === draggingIndex) {
          continue; // 自身の現在位置は基準にしない
        }
        const rect = rows[i].getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        if (clientY < center) {
          // i 番目の行の上側に挿入したい。自身が i より後ろにいる場合は i、
          // 前にいる場合は i-1（splice 後のインデックス整合のため）。
          return i > draggingIndex ? i - 1 : i;
        }
      }
      return lastIndex;
    }

    /**
     * ドラッグを確定し、一時状態と視覚フィードバックを解放する。
     * 確定時のインデックスが開始位置と異なれば moveSetlistItem で並び替え、
     * renderAll() で全再描画する（古い行・リスナは破棄され二重結線は起きない）。
     * @returns {void}
     */
    function finalizeDrag() {
      if (!activeDrag) {
        return;
      }
      const drag = activeDrag;
      activeDrag = null;

      // 挿入ラインを消す（確定・中断いずれの場合も）。
      hideInsertionIndicator();

      if (drag.row) {
        drag.row.classList.remove('setlist__row--dragging');
      }
      try {
        if (drag.handle && typeof drag.handle.releasePointerCapture === 'function') {
          drag.handle.releasePointerCapture(drag.pointerId);
        }
      } catch (err) {
        // 既に解放済み等は無視する。
      }

      if (drag.currentIndex !== drag.startIndex) {
        if (moveSetlistItem(drag.startIndex, drag.currentIndex)) {
          renderAll(); // 並び替え確定 → 全再描画で通し番号を同期（4.2）
        }
      }
    }

    /**
     * pointermove ハンドラ。進行中ドラッグの挿入先を更新する。
     * @param {PointerEvent} event
     * @returns {void}
     */
    function onReorderPointerMove(event) {
      if (!activeDrag || event.pointerId !== activeDrag.pointerId) {
        return;
      }
      // スクロール等の既定挙動を抑止（touch-action:none と併せて競合回避）。
      if (event.cancelable) {
        event.preventDefault();
      }
      const target = computeTargetIndex(event.clientY, activeDrag.currentIndex);
      activeDrag.currentIndex = target;
      // 挿入先の水色ラインを追従表示（どこに入るか分かりやすくする）。
      showInsertionIndicator(event.clientY);
    }

    /**
     * pointerup / pointercancel ハンドラ。ドラッグを確定する。
     * @param {PointerEvent} event
     * @returns {void}
     */
    function onReorderPointerUp(event) {
      if (!activeDrag || event.pointerId !== activeDrag.pointerId) {
        return;
      }
      finalizeDrag();
    }

    /**
     * 1つの並び替えハンドル（と対応する行）へ Pointer Events を結線する。
     * pointerdown でドラッグ開始（setPointerCapture）、move/up はハンドル自身に張る。
     * setPointerCapture により以降のイベントはキャプチャ中の要素へ届くため、
     * move/up をハンドルに張れば行外へ指が出ても追従できる。
     * @param {HTMLElement} handle 並び替えハンドル要素（data-role="reorder-handle"）
     * @param {HTMLTableRowElement} row 対応する行要素（data-index 保持）
     * @returns {void}
     */
    function attachReorderHandlers(handle, row) {
      handle.addEventListener('pointerdown', function (event) {
        // 主ボタン以外（右クリック等）は無視。タッチ/ペン/主ボタンのみ開始。
        if (event.button !== undefined && event.button > 0) {
          return;
        }
        // 既に別ドラッグ進行中なら無視（単一ポインタ追跡）。
        if (activeDrag) {
          return;
        }
        const index = Number(row.dataset.index);
        if (!Number.isInteger(index)) {
          return;
        }

        activeDrag = {
          pointerId: event.pointerId,
          handle: handle,
          row: row,
          startIndex: index,
          currentIndex: index,
          startClientY: event.clientY
        };

        row.classList.add('setlist__row--dragging');
        showInsertionIndicator(event.clientY); // 掴んだ瞬間に挿入ラインを表示
        try {
          handle.setPointerCapture(event.pointerId);
        } catch (err) {
          // 一部環境で失敗しても move/up は document へのフォールバックで拾えるよう
          // 後段のリスナで pointerId 照合する。
        }
        if (event.cancelable) {
          event.preventDefault();
        }
      });

      handle.addEventListener('pointermove', onReorderPointerMove);
      handle.addEventListener('pointerup', onReorderPointerUp);
      handle.addEventListener('pointercancel', onReorderPointerUp);
    }

    // ============================================================
    // Add Song Popup Controller: 曲選択ポップアップの制御（AddSongPopupController）
    // ------------------------------------------------------------
    // 責務（Requirements 3.1, 3.2, 3.3, 3.4, 3.6 / design AddSongPopupController）:
    //   - 追加ボタンのタップでポップアップを開く（hidden 解除）。
    //   - SONG_MASTER を読み仮名 reading（未設定時は title）昇順にソートして一覧描画
    //     （あいうえお順 / localeCompare('ja')）。
    //   - 一覧はスクロール可能なコンテナ（.popup__body{overflow-y:auto} + .popup{max-height}）
    //     に入れ、収まらない場合は縦スクロールできる。
    //   - 曲名タップで addSong(title) → renderAll() → 閉じる。
    //   - 閉じるボタンは state を変更せず閉じるのみ。
    //   - 「省略名称」トグルで表示を songShortTitle（省略名称）へ切り替え、一覧を
    //     レコード表示から折り返しボタン（.popup__list--compact）へ詰めて表示する。
    //     追加されるのは常に正式名称なので、セトリ・出力テキストは表示モードに依らない。
    // 状態変更は addSong ミューテータ経由のみ。描画は renderAll を直接呼ぶ。
    // 結線は initAddSongPopup() で行い、二重結線を防ぐためフラグで冪等化する
    // （後続 4.1 bootstrap から再度呼ばれても安全）。
    // ============================================================

    /**
     * 曲のソートキーを返す。読み仮名 reading を優先し、未設定（空文字・非文字列）
     * の場合は title へフォールバックする（Requirements 3.2）。
     * @param {Song} song 曲マスタの1曲
     * @returns {string} あいうえお順比較に用いるキー文字列
     */
    function songSortKey(song) {
      const source = song || {};
      const reading = typeof source.reading === 'string' ? source.reading.trim() : '';
      if (reading !== '') {
        return reading;
      }
      return typeof source.title === 'string' ? source.title : '';
    }

    /**
     * SONG_MASTER を読み仮名（フォールバック title）昇順にソートした新配列を返す
     * （元配列は破壊しない / Requirements 3.2）。比較は日本語ロケールで行う。
     * @returns {Song[]} あいうえお順に並んだ曲配列
     */
    function getSortedSongMaster() {
      return SONG_MASTER.slice().sort(function (a, b) {
        return songSortKey(a).localeCompare(songSortKey(b), 'ja');
      });
    }

    /** 省略名称モードの保存キー（表示設定のみ。リセットや保存データとは独立）。 */
    const SHORT_MODE_STORAGE_KEY = 'yuisrus-setlist:popup-short-mode:v1';

    /** 曲選択ポップアップを省略名称＋ボタン詰め表示にするか（true=省略名称）。 */
    let popupShortMode = false;

    /**
     * 省略名称モードの保存値を localStorage から復元する。
     * 未保存・参照不可なら既定（正式名称表示）のままにする。
     * @returns {void}
     */
    function loadPopupShortMode() {
      try {
        popupShortMode = window.localStorage.getItem(SHORT_MODE_STORAGE_KEY) === '1';
      } catch (err) {
        // 参照できなくても既定値で動作を継続する。
      }
    }

    /**
     * 省略名称モードの現在値を localStorage へ保存する。
     * 保存できない場合は無視する（アプリは継続動作）。
     * @returns {void}
     */
    function savePopupShortMode() {
      try {
        window.localStorage.setItem(SHORT_MODE_STORAGE_KEY, popupShortMode ? '1' : '0');
      } catch (err) {
        // 保存できなくても動作は継続する。
      }
    }

    /**
     * ポップアップの曲一覧（#popup-list）を SONG_MASTER のあいうえお順で描画する。
     * 各項目はタップ追加用のボタンで、タップで addSong→renderAll→閉じる（3.4）。
     * 曲名は textContent で挿入する（XSS安全）。
     * @returns {void}
     */
    function renderPopupSongList() {
      const list = document.getElementById('popup-list');
      if (!list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存項目をクリア）

      // 省略名称モードでは1行1件のレコード表示をやめ、ボタンを折り返して詰める。
      list.className = popupShortMode ? 'popup__list popup__list--compact' : 'popup__list';

      const songs = getSortedSongMaster();

      if (songs.length === 0) {
        const emptyItem = document.createElement('li');
        emptyItem.className = 'popup__empty';
        emptyItem.textContent = '選択できる曲がありません';
        list.appendChild(emptyItem);
        return;
      }

      const fragment = document.createDocumentFragment();
      songs.forEach(function (song) {
        const title = typeof song.title === 'string' ? song.title : '';
        const label = popupShortMode ? songShortTitle(title) : title;

        const item = document.createElement('li');
        item.className = 'popup__item';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'popup__item-button';
        button.dataset.role = 'song-option';
        button.textContent = label; // textContent で挿入（XSS安全）
        if (label !== title) {
          // 省略名称で表示している場合も、支援技術・ツールチップには正式名称を出す。
          button.setAttribute('aria-label', title);
          button.title = title;
        }
        button.addEventListener('click', function () {
          addSong(title);          // state ミューテータ経由で末尾追加（重複許可）
          renderAll();             // 再描画して連番同期
          closeAddSongPopup();     // 閉じる（3.4）
        });

        item.appendChild(button);
        fragment.appendChild(item);
      });
      list.appendChild(fragment);
    }

    /**
     * 省略名称トグルの押下状態（aria-pressed）を現在のモードへ同期する。
     * 「曲を選択」「曲で検索」の両ポップアップが同じモードを共有するため、
     * data-role で全トグルをまとめて更新する。CSS はこの属性を見て塗りつぶす。
     * @returns {void}
     */
    function syncPopupShortToggle() {
      const toggles = document.querySelectorAll('[data-role="popup-short-toggle"]');
      Array.prototype.forEach.call(toggles, function (toggle) {
        toggle.setAttribute('aria-pressed', popupShortMode ? 'true' : 'false');
      });
    }

    /**
     * 省略名称モードを反転し、保存・トグル表示・一覧を更新する。
     * 表示中でない側の一覧も描き直しておき、次に開いたときのズレを防ぐ。
     * state（セトリ・検索の選択）には触れないため、追加される曲名・出力テキスト・
     * 絞り込み条件は変わらない。
     * @returns {void}
     */
    function togglePopupShortMode() {
      popupShortMode = !popupShortMode;
      savePopupShortMode();
      syncPopupShortToggle();
      renderPopupSongList(); // 曲を選択
      renderSearchList();    // 曲で検索
    }

    /**
     * 曲選択ポップアップを開く（Requirements 3.1）。
     * 一覧をあいうえお順で描画してからオーバーレイを表示する。
     * @returns {void}
     */
    function openAddSongPopup() {
      const overlay = document.getElementById('popup-overlay');
      if (!overlay) {
        return;
      }
      syncPopupShortToggle(); // トグルの押下表示を現在のモードへ同期
      renderPopupSongList();  // 表示直前に最新のマスタを反映
      overlay.hidden = false;
    }

    /**
     * 曲選択ポップアップを閉じる（Requirements 3.6）。
     * state は一切変更しない（表示の切り替えのみ）。
     * @returns {void}
     */
    function closeAddSongPopup() {
      const overlay = document.getElementById('popup-overlay');
      if (!overlay) {
        return;
      }
      overlay.hidden = true;
    }

    /**
     * 追加ボタン・閉じるボタンへの結線を行う初期化（冪等）。
     * 二重結線を避けるため一度だけ実行する。後続 4.1 bootstrap から
     * 再度呼ばれても安全（項目タップの結線は renderPopupSongList 側で都度行う）。
     * @returns {void}
     */
    let addSongPopupWired = false;
    function initAddSongPopup() {
      if (addSongPopupWired) {
        return;
      }
      const addButton = document.getElementById('btn-add');
      const closeButton = document.getElementById('btn-popup-close');
      const shortToggle = document.getElementById('btn-popup-short');

      if (addButton) {
        addButton.addEventListener('click', openAddSongPopup);
      }
      if (closeButton) {
        closeButton.addEventListener('click', closeAddSongPopup);
      }
      if (shortToggle) {
        shortToggle.addEventListener('click', togglePopupShortMode);
      }

      loadPopupShortMode();   // 前回選んだ表示モードを復元
      syncPopupShortToggle(); // トグルの押下表示を復元値へ同期
      addSongPopupWired = true;
    }

    // ============================================================
    // Saved Setlist Controller: 保存・一覧・読込・削除の制御（SavedSetlistController）
    // ------------------------------------------------------------
    // 責務:
    //   - 「DBに追加」タップで現在の state を保存一覧へ1件追加する（明示操作）。
    //     セトリが空のときは保存せずトーストで知らせる。
    //   - 保存一覧ページの「追加」タップで貼り付け取り込みフォームを開き、他の人がこのツールで
    //     出力したテキストを parseSetlistText で読み取る。読み取った内容は確認画面で
    //     見せてから、「登録する」で保存一覧へ1件追加する。
    //   - 「保存一覧」タップで保存一覧ページ（#saved）へ移動し、保存済みを
    //     日付の新しい順に一覧表示する。
    //   - 一覧の項目タップで state へ読み込む（作業中の内容がある場合は確認する）。
    //   - 各項目の削除ボタンで1件削除する（確認あり）。
    // state 変更後は必ず applyStateToInputs → renderAll → saveState の順で反映する。
    // 見出し・会場名は textContent で挿入する（XSS安全）。
    // 結線は initSavedSetlist() で行い、フラグで冪等化する。
    // ============================================================

    /** 保存操作の通知文。 */
    const SAVE_EMPTY_MESSAGE = 'セトリが空です';
    const SAVE_SUCCESS_MESSAGE = 'DBに追加しました';
    const SAVE_FAILURE_MESSAGE = '保存に失敗しました';
    const IMPORT_FAILURE_MESSAGE = 'セトリを読み取れませんでした';

    /**
     * 保存済み1件の見出し（日付＋ライブ名）を組み立てる（純粋関数）。
     * どちらも未入力なら保存時刻、それも無ければ既定文言へフォールバックする。
     * @param {SavedSetlist} record 保存済みセトリ
     * @returns {string} 一覧に表示する見出し
     */
    function formatSavedTitle(record) {
      const parts = [];
      const date = formatDate(record.date);
      if (date !== '') {
        parts.push(date);
      }
      if (record.liveName !== '') {
        parts.push('『' + record.liveName + '』');
      }
      if (parts.length === 0) {
        return record.savedAt !== '' ? record.savedAt.slice(0, 10) : '（無題のセトリ）';
      }
      return parts.join(' ');
    }

    /**
     * 保存済み1件の補足行（会場・曲数）を組み立てる（純粋関数）。
     * @param {SavedSetlist} record 保存済みセトリ
     * @returns {string} 一覧に表示する補足文
     */
    function formatSavedMeta(record) {
      const parts = [];
      if (record.venue !== '') {
        parts.push(record.venue);
      }
      parts.push(record.setlist.length + '曲');
      // 区分がある場合だけ内訳を添える（例: 12曲（O.A 1・En 2））。
      const breakdown = [];
      if (record.oaCount > 0) {
        breakdown.push('O.A ' + record.oaCount);
      }
      if (record.enCount > 0) {
        breakdown.push('En ' + record.enCount);
      }
      if (breakdown.length > 0) {
        parts[parts.length - 1] += '（' + breakdown.join('・') + '）';
      }
      return parts.join('・');
    }

    /**
     * 保存済みセトリを「編集」として作業中の state へ読み込む。
     * 以降の保存はこの1件の上書きになる（state.editingId で紐づける）。
     * @param {SavedSetlist} record 編集する保存データ
     * @returns {void}
     */
    function editSavedSetlist(record) {
      if (
        state.setlist.length > 0 &&
        !window.confirm('編集を始めると、作業中のセトリは選んだ保存データで置き換わります。よろしいですか？')
      ) {
        return;
      }
      state.date = record.date;
      state.liveName = record.liveName;
      state.venue = record.venue;
      state.memo = record.memo;
      state.setlist = record.setlist.slice(); // 保存データと配列を共有しない
      state.tags = record.tags.slice();
      state.oaCount = record.oaCount;
      state.enCount = record.enCount;
      state.editingId = record.id;            // 以降の保存はこの1件の上書きになる

      applyStateToInputs(); // 入力欄（日付・ライブ名・会場名）へ反映
      renderAll();          // セトリ表を再描画して連番同期＋作業中データを保存
      syncEditingUi();      // 編集中の帯・保存ボタンの表示を切り替える
      goBackToMainPage();   // メイン画面で編集できるようにする
      showToast('編集を始めました。保存すると上書きします');
    }


    /**
     * 編集中の表示（帯・保存ボタンのラベル）を state.editingId に合わせて更新する。
     * 紐づけ先が消えている場合は編集中を解除して新規作成へ戻す。
     * @returns {void}
     */
    function syncEditingUi() {
      const banner = document.getElementById('editing-banner');
      const text = document.getElementById('editing-banner-text');
      const saveButton = document.getElementById('btn-save-db');

      let target = null;
      if (state.editingId !== '') {
        loadSavedSetlists().forEach(function (record) {
          if (record.id === state.editingId) {
            target = record;
          }
        });
        if (!target) {
          state.editingId = ''; // 元データが消えていたら新規作成へ戻す
        }
      }

      if (banner) {
        banner.hidden = target === null;
      }
      if (text && target) {
        text.textContent = '編集中：' + formatSavedTitle(target);
      }
      if (saveButton) {
        // アイコンを消さないよう、書き換えるのはラベル部分だけにする。
        const saveLabel = saveButton.querySelector('.btn-icon__label');
        if (saveLabel) {
          saveLabel.textContent = target ? '更新' : 'DBに追加';
        }
      }
    }

    /**
     * 編集中の紐づけを解除する（入力内容はそのまま残す）。
     * 以降の保存は新規追加になるため、複製を作りたいときにも使える。
     * @returns {void}
     */
    function cancelEditing() {
      if (state.editingId === '') {
        return;
      }
      state.editingId = '';
      saveState();
      syncEditingUi();
      showToast('編集を解除しました。保存すると新規追加になります');
    }

    /**
     * 保存一覧（#saved-list）を日付の新しい順（同日は追加の新しい順）で全再描画する。
     * 曲での絞り込み（savedFilter）が有効な場合は該当するライブだけを描画し、
     * 条件バー（#saved-filter）も更新する。
     * 各項目は読込ボタンと削除ボタンからなる。0件なら空メッセージを出す。
     * @returns {void}
     */
    /**
     * 一覧で展開中（セトリを開いている）保存データのID。
     * 再描画をまたいで開閉を保つため、描画関数の外に置く。保存はしない。
     * @type {Set<string>}
     */
    const expandedSavedIds = new Set();

    /**
     * 展開したセトリの中身（曲順のリスト）を組み立てる。
     * 参照用の表示なので曲名は正式名称のまま出す。
     * @param {SavedSetlist} record 表示する保存データ
     * @returns {HTMLOListElement} 曲順のリスト要素
     */
    /**
     * 保存一覧で見せるMCメモの要素を組み立てる。
     * 改行はそのまま見せる（CSS の white-space: pre-wrap）。
     * メモは textContent で挿入する（XSS安全）。
     * @param {string} memo メモ本文（空でないこと）
     * @returns {HTMLLIElement} 一覧へ差し込む要素
     */
    function buildSavedMemo(memo) {
      const item = document.createElement('li');
      item.className = 'saved-memo';

      const label = document.createElement('span');
      label.className = 'saved-memo__label';
      label.textContent = 'MCメモ';

      item.appendChild(label);
      item.appendChild(document.createTextNode(memo));
      return item;
    }

    function buildSavedSongList(record) {
      const songs = document.createElement('ul');
      songs.className = 'saved-songs';
      record.setlist.forEach(function (title, index) {
        const position = setlistPosition(
          index, record.oaCount, record.enCount, record.setlist.length
        );

        const song = document.createElement('li');
        song.className = 'saved-songs__item';

        // 番号は区分ごとに振り直すため、リストの自動採番ではなく明示的に出す。
        const no = document.createElement('span');
        no.className = 'saved-songs__no';
        no.textContent = setlistNoLabel(position) + '.';

        const name = document.createElement('span');
        name.textContent = title; // textContent で挿入（XSS安全）

        song.appendChild(no);
        song.appendChild(name);
        songs.appendChild(song);
      });
      return songs;
    }

    function renderSavedList() {
      const list = document.getElementById('saved-list');
      if (!list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存項目をクリア）

      const records = filterSavedSetlists(loadSavedSetlists(), savedFilter);
      renderSavedFilter(records.length); // 条件バー（絞り込み中のみ表示）

      if (records.length === 0) {
        const emptyItem = document.createElement('li');
        emptyItem.className = 'popup__empty';
        emptyItem.textContent = savedFilter.length > 0
          ? '選択した曲をすべて含むライブはありません'
          : '保存したセトリはありません';
        list.appendChild(emptyItem);
        return;
      }

      const fragment = document.createDocumentFragment();
      records.forEach(function (record) {
        const heading = formatSavedTitle(record);
        const expanded = expandedSavedIds.has(record.id);

        const item = document.createElement('li');
        item.className = expanded
          ? 'popup__item popup__item--saved popup__item--expanded'
          : 'popup__item popup__item--saved';

        const toggleButton = document.createElement('button');
        toggleButton.type = 'button';
        toggleButton.className = 'popup__item-button';
        toggleButton.dataset.role = 'saved-toggle';
        toggleButton.setAttribute('aria-expanded', expanded ? 'true' : 'false');

        const caret = document.createElement('span');
        caret.className = 'saved-caret';
        caret.textContent = '▶';
        caret.setAttribute('aria-hidden', 'true'); // 状態は aria-expanded で伝える

        const label = document.createElement('span');
        label.className = 'popup__item-label';

        const titleEl = document.createElement('span');
        titleEl.className = 'popup__item-title';
        titleEl.textContent = heading; // textContent で挿入（XSS安全）

        const metaEl = document.createElement('span');
        metaEl.className = 'popup__item-meta';
        metaEl.textContent = formatSavedMeta(record);

        label.appendChild(titleEl);
        label.appendChild(metaEl);

        // 属性は読み取り専用のチップで見出しの下に並べる。
        const names = tagNames(record.tags);
        if (names.length > 0) {
          const tagsEl = document.createElement('span');
          tagsEl.className = 'saved-tags';
          names.forEach(function (name) {
            const chip = document.createElement('span');
            chip.className = 'saved-tags__item';
            chip.textContent = name; // textContent で挿入（XSS安全）
            tagsEl.appendChild(chip);
          });
          label.appendChild(tagsEl);
        }
        toggleButton.appendChild(caret);
        toggleButton.appendChild(label);

        // セトリ本体（参照用）。行タップで開閉する。MCメモがあれば下に添える。
        const songs = buildSavedSongList(record);
        if (record.memo !== '') {
          songs.appendChild(buildSavedMemo(record.memo));
        }
        songs.hidden = !expanded;

        toggleButton.addEventListener('click', function () {
          // 「このライブ何やったんだっけ」を確認するための開閉。state は変えない。
          const open = !expandedSavedIds.has(record.id);
          if (open) {
            expandedSavedIds.add(record.id);
          } else {
            expandedSavedIds.delete(record.id);
          }
          toggleButton.setAttribute('aria-expanded', open ? 'true' : 'false');
          item.classList.toggle('popup__item--expanded', open); // 見出しの省略を解く
          songs.hidden = !open;
        });

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'popup__item-edit';
        editButton.dataset.role = 'saved-edit';
        editButton.textContent = '編集';
        editButton.setAttribute('aria-label', heading + ' を編集');
        editButton.addEventListener('click', function () {
          editSavedSetlist(record);
        });

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'setlist__remove popup__item-remove';
        removeButton.dataset.role = 'saved-remove';
        removeButton.textContent = '削除';
        removeButton.setAttribute('aria-label', heading + ' を削除');
        removeButton.addEventListener('click', function () {
          // 復元できない操作のため確認する（誤タップ防止）。
          if (!window.confirm('この保存データを削除します。よろしいですか？')) {
            return;
          }
          if (removeSavedSetlist(record.id)) {
            expandedSavedIds.delete(record.id); // 展開状態も捨てる
            renderSavedList(); // 一覧を最新化
            syncEditingUi();   // 編集中の1件を消した場合は編集中を解除する
            showToast('削除しました');
          } else {
            showToast(SAVE_FAILURE_MESSAGE);
          }
        });

        item.appendChild(toggleButton);
        item.appendChild(editButton);
        item.appendChild(removeButton);
        item.appendChild(songs);
        fragment.appendChild(item);
      });
      list.appendChild(fragment);
    }

    /**
     * 貼り付け取り込みフォームを開く（テキスト入力へフォーカスする）。
     * 他の人がこのツールで出力したテキストを、そのまま貼って取り込むための入口。
     * @returns {void}
     */
    function openImportForm() {
      const form = document.getElementById('saved-add');
      const input = document.getElementById('saved-add-input');
      if (!form) {
        return;
      }
      closeBackupPanel(); // バックアップパネルとは排他にする
      form.hidden = false;
      if (input) {
        input.focus();
      }
    }

    /**
     * 貼り付け取り込みフォームを閉じ、入力内容を捨てる。
     * @returns {void}
     */
    function closeImportForm() {
      const form = document.getElementById('saved-add');
      const input = document.getElementById('saved-add-input');
      if (!form) {
        return;
      }
      form.hidden = true;
      if (input) {
        input.value = '';
      }
    }

    /**
     * 入力されたテキストを読み取り、取り込みを開始する。
     * 曲を1曲も読み取れない場合は何もせずトーストで知らせる（入力は残す）。
     * 曲マスタに無い曲名があれば確認へ進む（startImport）。
     * @returns {void}
     */
    function submitImportForm() {
      const input = document.getElementById('saved-add-input');
      if (!input) {
        return;
      }
      const parsed = parseSetlistText(input.value);
      if (!parsed) {
        showToast(IMPORT_FAILURE_MESSAGE); // 書き直せるよう入力は消さない
        return;
      }
      startImport(parsed);
    }

    /**
     * 読み取ったセトリを保存一覧へ1件追加し、一覧を最新化する。
     * 追加した1件が絞り込みで隠れないよう、成功時は絞り込みを解除する。
     * @param {{date: string, liveName: string, venue: string, setlist: string[]}} source 追加する内容
     * @returns {void}
     */
    function commitImport(source) {
      const record = appendSavedSetlist(source);
      if (!record) {
        showToast(SAVE_FAILURE_MESSAGE);
        return;
      }

      closeImportForm();
      resetSearchSelection(); // 追加した1件が絞り込みで隠れないようにする
      renderSavedList();
      updateSearchRunButton();
      showToast(record.setlist.length + '曲のセトリを追加しました');
    }

    // ============================================================
    // Backup Controller: 保存データの書き出し／取り込み（BackupController）
    // ------------------------------------------------------------
    // 責務:
    //   - 「バックアップ」タップで保存一覧の全件を JSON として書き出し、コピー
    //     または .json ファイルとして保存できるようにする（機種変更・受け渡し用）。
    //   - 書き出す setlist は曲ID（マスタ外の曲だけ曲名の文字列）。version 1 の
    //     曲名配列も取り込めるので、古い書き出しファイルもそのまま読める。
    //   - 受け取った JSON を貼り付け／ファイル選択で取り込み、保存一覧へ追加する。
    //     取り込みは「追加」のみで、既存データを消したり置き換えたりしない。
    //   - 同じ内容のセトリ（日付・ライブ名・会場・曲順が一致）はスキップするため、
    //     同じファイルを二度取り込んでも増えない。IDだけが衝突した場合は新しいID
    //     を振り直して追加する（別物を取りこぼさないため）。
    // 検証は既存の normalizeSavedSetlist に委ね、壊れた要素は静かに捨てる。
    // ============================================================

    /** 書き出す JSON の形式名と版番号（形式を変えたら版番号を上げる）。 */
    const BACKUP_FORMAT = 'yuisrus-setlist-backup';
    const BACKUP_VERSION = 3; // 2: 曲名の配列→曲IDの配列 / 3: O.A・アンコールの曲数を追加

    /** 取り込み結果の通知文。 */
    const BACKUP_PARSE_FAILURE_MESSAGE = 'JSONを読み取れませんでした';
    const BACKUP_EMPTY_MESSAGE = '取り込めるセトリがありませんでした';

    /**
     * 保存一覧の全件を書き出し用の JSON 文字列にする。
     * 人が読むものではないため字下げは付けない（コピーする文字数を減らす）。
     * @returns {string} 書き出す JSON
     */
    function buildBackupJson() {
      return JSON.stringify({
        format: BACKUP_FORMAT,
        version: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        setlists: loadSavedSetlists().map(toStoredSavedSetlist) // 曲はIDで書き出す
      });
    }

    /**
     * 保存済み1件の内容キーを作る（純粋関数）。IDと保存時刻は含めないので、
     * 別の端末で保存された同じライブのセトリも同一と判定できる。
     * @param {SavedSetlist} record 保存済みセトリ
     * @returns {string} 内容の同一性を比べるキー
     */
    function savedSetlistKey(record) {
      return [
        record.date,
        record.liveName,
        record.venue,
        record.tags.join(','),
        record.oaCount,
        record.enCount,
        record.setlist.join('\u0000')
      ].join('\u0001');
    }

    /**
     * 書き出した JSON（または保存済みセトリの配列）を読み取る（純粋関数）。
     * 形式が違う・壊れている場合は null を返し、要素単位の不正は捨てる。
     * @param {string} text 貼り付けられた JSON 文字列
     * @returns {SavedSetlist[]|null} 取り込み候補の配列。読み取れなければ null
     */
    function parseBackupJson(text) {
      if (typeof text !== 'string' || text.trim() === '') {
        return null;
      }
      let data = null;
      try {
        data = JSON.parse(text);
      } catch (err) {
        return null; // JSON として読めない
      }
      // { setlists: [...] } と、配列そのものの両方を受け付ける。
      const list = Array.isArray(data)
        ? data
        : (data && typeof data === 'object' && Array.isArray(data.setlists) ? data.setlists : null);
      if (!list) {
        return null;
      }
      const records = [];
      list.forEach(function (item) {
        const record = normalizeSavedSetlist(item);
        if (record) {
          records.push(record); // 壊れた要素・空セトリは静かに捨てる
        }
      });
      return records;
    }

    /**
     * 取り込み候補を保存一覧へ追加する（既存は消さない）。
     * 内容が同じセトリはスキップし、IDだけ衝突した場合は新しいIDを振って追加する。
     * @param {SavedSetlist[]} incoming 取り込む候補
     * @returns {{added: number, skipped: number, ok: boolean}} 追加件数・スキップ件数・書き込み成否
     */
    function mergeSavedSetlists(incoming) {
      const records = loadSavedSetlists();
      const usedIds = {};
      const usedKeys = {};
      records.forEach(function (record) {
        usedIds[record.id] = true;
        usedKeys[savedSetlistKey(record)] = true;
      });

      let added = 0;
      let skipped = 0;
      incoming.forEach(function (record) {
        const key = savedSetlistKey(record);
        if (usedKeys[key]) {
          skipped += 1; // すでに同じ内容を持っている
          return;
        }
        const id = usedIds[record.id] ? createSavedId() : record.id;
        usedIds[id] = true;
        usedKeys[key] = true;
        records.push({
          id: id,
          savedAt: record.savedAt,
          date: record.date,
          liveName: record.liveName,
          venue: record.venue,
          memo: record.memo,
          tags: record.tags.slice(),
          oaCount: record.oaCount,
          enCount: record.enCount,
          setlist: record.setlist.slice()
        });
        added += 1;
      });

      if (added === 0) {
        return { added: 0, skipped: skipped, ok: true }; // 書き込む必要なし
      }
      return { added: added, skipped: skipped, ok: writeSavedSetlists(records) };
    }

    /**
     * バックアップパネルを開く（書き出し JSON を入力欄へ入れておく）。
     * 貼り付け取り込みフォームとは同時に開かない。
     * @returns {void}
     */
    function openBackupPanel() {
      const panel = document.getElementById('saved-backup');
      const input = document.getElementById('saved-backup-input');
      if (!panel) {
        return;
      }
      closeImportForm(); // 「追加」フォームとは排他にする
      if (input) {
        input.value = buildBackupJson();
      }
      panel.hidden = false;
    }

    /**
     * バックアップパネルを閉じ、入力欄の内容を捨てる。
     * @returns {void}
     */
    function closeBackupPanel() {
      const panel = document.getElementById('saved-backup');
      const input = document.getElementById('saved-backup-input');
      const file = document.getElementById('saved-backup-file');
      if (!panel) {
        return;
      }
      panel.hidden = true;
      if (input) {
        input.value = '';
      }
      if (file) {
        file.value = ''; // 同じファイルを選び直せるようにする
      }
    }

    /**
     * 書き出し欄に表示している JSON を返す（空なら現在の全件を書き出す）。
     * 「見えているものがコピー・保存される」ようにするための小さなヘルパ。
     * @returns {string} コピー／保存する JSON
     */
    function currentBackupJson() {
      const input = document.getElementById('saved-backup-input');
      const value = input && typeof input.value === 'string' ? input.value.trim() : '';
      return value !== '' ? value : buildBackupJson();
    }

    /**
     * 書き出した JSON を .json ファイルとして保存する。
     * Blob URL は使い終わったら解放する（メモリを掴んだままにしない）。
     * @returns {void}
     */
    function downloadBackupFile() {
      const json = currentBackupJson();
      const stamp = todayString().replace(/-/g, ''); // ファイル名は YYYYMMDD
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'yuisrus-setlist-' + stamp + '.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      // 一部ブラウザは click 直後の解放でダウンロードが中断するため少し待つ。
      window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    /**
     * 選ばれた .json ファイルを読み、入力欄へ入れてそのまま取り込む。
     * @param {File} file 選択されたファイル
     * @returns {void}
     */
    function readBackupFile(file) {
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.onload = function () {
        const input = document.getElementById('saved-backup-input');
        const text = typeof reader.result === 'string' ? reader.result : '';
        if (input) {
          input.value = text; // 中身を見せてから取り込む
        }
        submitBackupImport();
      };
      reader.onerror = function () {
        showToast(BACKUP_PARSE_FAILURE_MESSAGE);
      };
      reader.readAsText(file);
    }

    /**
     * 入力欄の JSON を取り込み、結果をトーストで知らせる。
     * 読み取れない場合は書き直せるよう入力は消さない。
     * @returns {void}
     */
    function submitBackupImport() {
      const input = document.getElementById('saved-backup-input');
      if (!input) {
        return;
      }
      const incoming = parseBackupJson(input.value);
      if (!incoming) {
        showToast(BACKUP_PARSE_FAILURE_MESSAGE);
        return;
      }
      if (incoming.length === 0) {
        showToast(BACKUP_EMPTY_MESSAGE);
        return;
      }

      const result = mergeSavedSetlists(incoming);
      if (!result.ok) {
        showToast(SAVE_FAILURE_MESSAGE);
        return;
      }

      resetSearchSelection(); // 取り込んだ分が絞り込みで隠れないようにする
      renderSavedList();
      updateSearchRunButton();

      if (result.added === 0) {
        showToast('すべて取り込み済みでした（' + result.skipped + '件）');
        return;
      }
      closeBackupPanel();
      showToast(
        result.skipped === 0
          ? result.added + '件を取り込みました'
          : result.added + '件を取り込みました（' + result.skipped + '件は取り込み済み）'
      );
    }

    /**
     * バックアップまわり（開く／コピー／ファイル保存／ファイル選択／取り込み／閉じる）
     * の結線を行う初期化（冪等）。
     * @returns {void}
     */
    let savedBackupWired = false;
    function initSavedBackup() {
      if (savedBackupWired) {
        return;
      }
      const openButton = document.getElementById('btn-backup-open');
      const copyButton = document.getElementById('btn-backup-copy');
      const downloadButton = document.getElementById('btn-backup-download');
      const fileOpenButton = document.getElementById('btn-backup-file-open');
      const importButton = document.getElementById('btn-backup-import');
      const cancelButton = document.getElementById('btn-backup-cancel');
      const fileInput = document.getElementById('saved-backup-file');

      if (openButton) {
        openButton.addEventListener('click', openBackupPanel);
      }
      if (copyButton) {
        copyButton.addEventListener('click', async function () {
          const ok = await copyToClipboard(currentBackupJson());
          showToast(ok ? COPY_SUCCESS_MESSAGE : COPY_FAILURE_MESSAGE);
        });
      }
      if (downloadButton) {
        downloadButton.addEventListener('click', downloadBackupFile);
      }
      if (fileOpenButton && fileInput) {
        fileOpenButton.addEventListener('click', function () {
          fileInput.click(); // 見た目を揃えるため input は隠してボタンから開く
        });
      }
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          readBackupFile(fileInput.files && fileInput.files[0]);
          fileInput.value = ''; // 同じファイルを続けて選べるようにする
        });
      }
      if (importButton) {
        importButton.addEventListener('click', submitBackupImport);
      }
      if (cancelButton) {
        cancelButton.addEventListener('click', closeBackupPanel);
      }
      savedBackupWired = true;
    }

    /**
     * 保存一覧ページを離れるときの後始末（作業中の state は変更しない）。
     * 確認中の取り込みは持ち越さず、次に開いたときは常に全件から始められるよう
     * 曲での絞り込みと選択も捨てる。開いたままのポップアップやパネルは閉じる。
     * @returns {void}
     */
    function leaveSavedPage() {
      if (pendingImport) {
        pendingImport = null;
        closeResolvePopup();
      }
      closeImportConfirm(); // 確認中の取り込みは持ち越さない
      closeSearchPopup();
      closeImportForm();
      closeBackupPanel();
      resetSearchSelection();
    }

    /**
     * 「DBに追加」「保存一覧」「戻る」ボタンの結線を行う初期化（冪等）。
     * 二重結線を避けるため一度だけ実行する（項目側の結線は renderSavedList が都度行う）。
     * @returns {void}
     */
    let savedSetlistWired = false;
    function initSavedSetlist() {
      if (savedSetlistWired) {
        return;
      }
      const saveButton = document.getElementById('btn-save-db');
      const listButton = document.getElementById('btn-saved-list');
      const backButton = document.getElementById('btn-saved-back');
      const editingCancelButton = document.getElementById('btn-editing-cancel');
      const importOpenButton = document.getElementById('btn-saved-add-open');
      const importCancelButton = document.getElementById('btn-saved-add-cancel');
      const importSubmitButton = document.getElementById('btn-saved-add-submit');

      if (saveButton) {
        saveButton.addEventListener('click', function () {
          if (state.setlist.length === 0) {
            showToast(SAVE_EMPTY_MESSAGE); // 空セトリは保存しない
            return;
          }
          if (state.editingId !== '') {
            const updated = updateSavedSetlist(state.editingId, state);
            if (updated) {
              showToast('更新しました');
              return;
            }
            // 元の保存データが見つからない（消された等）→ 新規追加へフォールバックする。
            state.editingId = '';
            saveState();
            syncEditingUi();
            const added = appendSavedSetlist(state);
            showToast(added ? '元の保存データが無いため新しく追加しました' : SAVE_FAILURE_MESSAGE);
            return;
          }
          const record = appendSavedSetlist(state);
          showToast(record ? SAVE_SUCCESS_MESSAGE : SAVE_FAILURE_MESSAGE);
        });
      }
      if (listButton) {
        listButton.addEventListener('click', goToSavedPage);
      }
      if (backButton) {
        backButton.addEventListener('click', goBackToMainPage);
      }
      if (editingCancelButton) {
        editingCancelButton.addEventListener('click', cancelEditing);
      }
      if (importOpenButton) {
        importOpenButton.addEventListener('click', openImportForm);
      }
      if (importCancelButton) {
        importCancelButton.addEventListener('click', closeImportForm);
      }
      if (importSubmitButton) {
        importSubmitButton.addEventListener('click', submitImportForm);
      }
      savedSetlistWired = true;
    }

    // ============================================================
    // Import Resolve Controller: 取り込み時の曲名確認（ImportResolveController）
    // ------------------------------------------------------------
    // 貼り付けたテキストの曲名を曲マスタと照合し、一致した曲は正式名称へ揃える
    // （省略名称や空白差での表記ゆれもここで吸収する）。一致しなかった曲名は
    // その場でユーザーへ確認する: 近い曲の候補（もしかしてこの曲？）か曲一覧から
    // 選ぶ／このまま追加／この曲を除く。候補は提示するだけで自動採用はしない
    // （誤った曲名が保存に残ると後から直しにくいため、選ぶのは必ず人）。
    // 同じ曲名が複数行にある場合は1回の確認をすべての行へまとめて適用する。
    // 確認をすべて終えたら（または未知の曲が無ければ）保存一覧へ1件追加する。
    // ============================================================

    /**
     * 確認待ちの取り込みデータ。確認中のみ保持し、完了・中止で null へ戻す。
     * setlist の null は「除く」と決めた行で、追加時に取り除く。
     * @type {{date: string, liveName: string, venue: string,
     *   setlist: Array<string|null>, queue: string[], position: number}|null}
     */
    let pendingImport = null;

    /**
     * 読み取ったセトリの曲名を曲マスタと照合し、取り込みを開始する。
     * 未知の曲名が無ければそのまま追加し、あれば確認ポップアップを開く。
     * @param {{date: string, liveName: string, venue: string, setlist: string[]}} parsed 読み取り結果
     * @returns {void}
     */
    function startImport(parsed) {
      const setlist = [];
      const queue = [];
      // 確認で曲が除かれても区分が崩れないよう、曲と同じ並びで区分も持ち回る。
      const sections = parsed.setlist.map(function (title, index) {
        return setlistPosition(index, parsed.oaCount, parsed.enCount, parsed.setlist.length).section;
      });

      parsed.setlist.forEach(function (title) {
        const resolved = resolveSongTitle(title);
        setlist.push(resolved !== null ? resolved : title); // 一致した曲は正式名称へ揃える
        if (resolved === null && queue.indexOf(title) === -1) {
          queue.push(title); // 同じ曲名は1回だけ確認する
        }
      });

      if (queue.length === 0) {
        openImportConfirm({
          date: parsed.date,
          liveName: parsed.liveName,
          venue: parsed.venue,
          oaCount: parsed.oaCount,
          enCount: parsed.enCount,
          setlist: setlist
        });
        return;
      }

      pendingImport = {
        date: parsed.date,
        liveName: parsed.liveName,
        venue: parsed.venue,
        setlist: setlist,
        sections: sections,
        queue: queue,
        position: 0
      };
      openResolvePopup();
    }

    /**
     * 確認中の曲名を持つ行をまとめて置き換える。
     * @param {string|null} value 置き換える曲名。null はその行を取り込みから除く印
     * @returns {void}
     */
    function replaceResolveTarget(value) {
      const target = pendingImport.queue[pendingImport.position];
      pendingImport.setlist = pendingImport.setlist.map(function (title) {
        return title === target ? value : title;
      });
    }

    /**
     * 次の確認へ進む。残りが無ければ取り込みを確定する。
     * @returns {void}
     */
    function advanceResolve() {
      if (!pendingImport) {
        return;
      }
      pendingImport.position += 1;
      if (pendingImport.position < pendingImport.queue.length) {
        renderResolveStep();
        return;
      }
      finishResolve();
    }

    /**
     * すべての確認を終えて保存一覧へ追加する。
     * 「除く」で曲が無くなった場合は追加せずトーストで知らせる。
     * @returns {void}
     */
    function finishResolve() {
      const source = pendingImport;
      pendingImport = null;
      closeResolvePopup();

      // 「除く」で消えた曲を落としつつ、残った曲の区分から曲数を数え直す。
      const setlist = [];
      let oaCount = 0;
      let enCount = 0;
      source.setlist.forEach(function (title, index) {
        if (typeof title !== 'string' || title === '') {
          return;
        }
        setlist.push(title);
        if (source.sections[index] === 'oa') {
          oaCount += 1;
        } else if (source.sections[index] === 'en') {
          enCount += 1;
        }
      });
      if (setlist.length === 0) {
        showToast('取り込む曲がなくなりました');
        return;
      }
      openImportConfirm({
        date: source.date,
        liveName: source.liveName,
        venue: source.venue,
        oaCount: oaCount,
        enCount: enCount,
        setlist: setlist
      });
    }

    /**
     * 取り込みを中止する（貼り付けた文面は残すので書き直して再実行できる）。
     * @returns {void}
     */
    function cancelResolve() {
      pendingImport = null;
      closeResolvePopup();
      showToast('取り込みを中止しました');
    }

    /**
     * 確認中の曲名を、選んだ曲マスタの曲へ置き換えて次へ進む。
     * @param {string} title 選んだ曲の正式名称
     * @returns {void}
     */
    function chooseResolveSong(title) {
      if (!pendingImport) {
        return;
      }
      replaceResolveTarget(title);
      advanceResolve();
    }

    /**
     * 確認中の曲名を読み取ったまま取り込んで次へ進む（マスタに無い曲名のまま残す）。
     * @returns {void}
     */
    function keepResolveSong() {
      if (!pendingImport) {
        return;
      }
      advanceResolve(); // 置き換えないのでそのまま残る
    }

    /**
     * 確認中の曲名の行を取り込みから除いて次へ進む。
     * @returns {void}
     */
    function skipResolveSong() {
      if (!pendingImport) {
        return;
      }
      replaceResolveTarget(null);
      advanceResolve();
    }

    /**
     * 曲を選ぶボタン（li 要素）を組み立てる。
     * タップでその曲へ置き換える。曲名は textContent で挿入する（XSS安全）。
     * @param {string} title 曲の正式名称
     * @param {boolean} suggested 候補として目立たせるなら true
     * @returns {HTMLLIElement} 一覧へ差し込む項目
     */
    function buildResolveOption(title, suggested) {
      const item = document.createElement('li');
      item.className = 'popup__item';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = suggested
        ? 'popup__item-button popup__item-button--suggest'
        : 'popup__item-button';
      button.dataset.role = suggested ? 'resolve-candidate' : 'resolve-option';
      button.textContent = title; // textContent で挿入（XSS安全）
      button.addEventListener('click', function () {
        chooseResolveSong(title);
      });

      item.appendChild(button);
      return item;
    }

    /**
     * 「もしかしてこの曲？」の候補（#resolve-candidates）を近い順に描画する。
     * 候補が1件も無ければブロックごと隠す（下の曲一覧から選べばよい）。
     * @param {string} unknownTitle 完全一致しなかった曲名
     * @returns {void}
     */
    function renderResolveCandidates(unknownTitle) {
      const box = document.getElementById('resolve-suggest');
      const list = document.getElementById('resolve-candidates');
      if (!box || !list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存候補をクリア）

      const candidates = findSongCandidates(unknownTitle);
      if (candidates.length === 0) {
        box.hidden = true;
        return;
      }

      const fragment = document.createDocumentFragment();
      candidates.forEach(function (song) {
        fragment.appendChild(buildResolveOption(song.title, true));
      });
      list.appendChild(fragment);
      box.hidden = false;
    }

    /**
     * 確認用の曲一覧（#resolve-list）を SONG_MASTER のあいうえお順で描画する。
     * 曲名タップでその曲へ置き換える。曲名は textContent で挿入する（XSS安全）。
     * @returns {void}
     */
    function renderResolveList() {
      const list = document.getElementById('resolve-list');
      if (!list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存項目をクリア）

      const songs = getSortedSongMaster();

      if (songs.length === 0) {
        const emptyItem = document.createElement('li');
        emptyItem.className = 'popup__empty';
        emptyItem.textContent = '選択できる曲がありません';
        list.appendChild(emptyItem);
        return;
      }

      const fragment = document.createDocumentFragment();
      songs.forEach(function (song) {
        const title = typeof song.title === 'string' ? song.title : '';
        fragment.appendChild(buildResolveOption(title, false));
      });
      list.appendChild(fragment);
    }

    /**
     * 確認中の1件分（進捗と対象の曲名、候補、曲一覧）を描画する。
     * 一覧は毎回描き直し、先頭から選べる状態にする。
     * @returns {void}
     */
    function renderResolveStep() {
      if (!pendingImport) {
        return;
      }
      const progress = document.getElementById('resolve-progress');
      const unknown = document.getElementById('resolve-unknown');

      if (progress) {
        progress.textContent = pendingImport.queue.length + '件中 ' +
          (pendingImport.position + 1) + '件目';
      }
      const target = pendingImport.queue[pendingImport.position];
      if (unknown) {
        // textContent で挿入（XSS安全）。
        unknown.textContent = '「' + target + '」';
      }
      renderResolveCandidates(target); // 近い曲があれば一覧の上に出す
      renderResolveList();
      scrollResolveListTop();
    }

    /**
     * 確認用の曲一覧を先頭までスクロールする。
     * 非表示（hidden）の間はスクロール位置を変えられないため、表示にした
     * 直後にも呼ぶ必要がある。
     * @returns {void}
     */
    function scrollResolveListTop() {
      const body = document.querySelector('#resolve-overlay .popup__body');
      if (body) {
        body.scrollTop = 0;
      }
    }

    /**
     * 曲名確認ポップアップを開く（保存一覧ページの上に重ねて表示する）。
     * @returns {void}
     */
    function openResolvePopup() {
      const overlay = document.getElementById('resolve-overlay');
      if (!overlay) {
        return;
      }
      renderResolveStep();   // 中身を用意してから表示する
      overlay.hidden = false;
      scrollResolveListTop(); // 表示後でないとスクロール位置は反映されない
    }

    /**
     * 曲名確認ポップアップを閉じる（確認状態の後始末は呼び出し側の責務）。
     * @returns {void}
     */
    function closeResolvePopup() {
      const overlay = document.getElementById('resolve-overlay');
      if (!overlay) {
        return;
      }
      overlay.hidden = true;
    }

    /**
     * 確認ポップアップのボタン（中止／このまま追加／この曲を除く）を結線する（冪等）。
     * 曲一覧の結線は renderResolveList 側で都度行う。
     * @returns {void}
     */
    let importResolveWired = false;
    function initImportResolve() {
      if (importResolveWired) {
        return;
      }
      const cancelButton = document.getElementById('btn-resolve-cancel');
      const keepButton = document.getElementById('btn-resolve-keep');
      const skipButton = document.getElementById('btn-resolve-skip');

      if (cancelButton) {
        cancelButton.addEventListener('click', cancelResolve);
      }
      if (keepButton) {
        keepButton.addEventListener('click', keepResolveSong);
      }
      if (skipButton) {
        skipButton.addEventListener('click', skipResolveSong);
      }
      importResolveWired = true;
    }

    // ============================================================
    // Saved Setlist Search Controller: 曲での絞り込み（SavedSetlistSearchController）
    // ------------------------------------------------------------
    // 責務:
    //   - 保存一覧ページの「検索する」タップで曲一覧ポップアップを開く。
    //   - 曲はタップで選択／もう一度タップで解除するトグル（複数選択可）。
    //     一覧はスクロール位置を保つため、トグル時は該当項目だけを更新する。
    //   - ポップアップ上部の「検索」タップで、選択した曲を **すべて** 含むライブ
    //     （AND 条件）だけを保存一覧へ表示する。未選択で検索した場合は全件へ戻す。
    //   - 絞り込み中は条件バーを表示し、「解除」で全件へ戻せる。
    // 絞り込みは表示だけの操作で、保存データも作業中の state も変更しない。
    // ============================================================

    /** 曲一覧で選択中の曲タイトル（検索ボタンを押すまでは確定しない）。 */
    let searchSelection = [];

    /** 保存一覧へ適用中の絞り込み条件（検索ボタン押下で確定した曲タイトル）。 */
    let savedFilter = [];

    /**
     * 選択中の曲と絞り込み条件をどちらも捨てる（全件表示の状態へ戻す）。
     * 描画は呼び出し側で行う。
     * @returns {void}
     */
    function resetSearchSelection() {
      searchSelection = [];
      savedFilter = [];
    }

    /**
     * 指定した曲が選択中かを返す。
     * @param {string} title 曲タイトル
     * @returns {boolean} 選択中なら true
     */
    function isSongSelected(title) {
      return searchSelection.indexOf(title) !== -1;
    }

    /**
     * 曲の選択状態を反転する（未選択→選択／選択→未選択）。
     * @param {string} title 曲タイトル
     * @returns {boolean} 反転後に選択中なら true
     */
    function toggleSongSelection(title) {
      const index = searchSelection.indexOf(title);
      if (index === -1) {
        searchSelection.push(title);
        return true;
      }
      searchSelection.splice(index, 1);
      return false;
    }

    /**
     * 保存済みセトリを、指定した曲を **すべて** 含むものだけへ絞り込む（純粋関数）。
     * 条件が空なら元の配列をそのまま返す（全件表示）。
     * @param {SavedSetlist[]} records 絞り込み対象
     * @param {string[]} titles 条件となる曲タイトル（AND 条件）
     * @returns {SavedSetlist[]} 条件を満たす保存済みセトリ
     */
    function filterSavedSetlists(records, titles) {
      if (!Array.isArray(titles) || titles.length === 0) {
        return records;
      }
      return records.filter(function (record) {
        return titles.every(function (title) {
          return record.setlist.indexOf(title) !== -1;
        });
      });
    }

    /**
     * 絞り込み条件バー（#saved-filter）を更新する。
     * 絞り込み中のみ表示し、条件の曲を1曲ずつチップで並べる。各チップは
     * 解除ボタンを持ち、押すとその曲だけを条件から外す。
     * 曲名は textContent で挿入する（XSS安全）。
     * @param {number} matchedCount 条件を満たしたライブの件数
     * @returns {void}
     */
    function renderSavedFilter(matchedCount) {
      const bar = document.getElementById('saved-filter');
      const list = document.getElementById('saved-filter-list');
      const count = document.getElementById('saved-filter-count');
      if (!bar || !list || !count) {
        return;
      }
      list.textContent = ''; // 全再描画（既存チップをクリア）

      if (savedFilter.length === 0) {
        bar.hidden = true;
        count.textContent = '';
        return;
      }

      const fragment = document.createDocumentFragment();
      savedFilter.forEach(function (title) {
        // 幅を取らないよう省略名称で表示する（未設定の曲はタイトルのまま）。
        const label = songShortTitle(title);

        const item = document.createElement('li');
        item.className = 'saved-filter__item';
        if (label !== title) {
          item.title = title; // 省略時はホバーで正式名称を確認できる
        }

        const song = document.createElement('span');
        song.className = 'saved-filter__song';
        song.textContent = '「' + label + '」'; // textContent で挿入（XSS安全）

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'saved-filter__remove';
        removeButton.dataset.role = 'filter-remove';
        removeButton.textContent = '✕';
        removeButton.setAttribute('aria-label', '「' + label + '」を条件から外す');
        removeButton.addEventListener('click', function () {
          removeFilterSong(title);
        });

        item.appendChild(song);
        item.appendChild(removeButton);
        fragment.appendChild(item);
      });
      list.appendChild(fragment);

      count.textContent = '該当 ' + matchedCount + '件';
      bar.hidden = false;
    }

    /**
     * 現在の絞り込み条件での該当件数をトーストで知らせる。
     * 条件が無い場合は全件表示へ戻った旨を出す。
     * @returns {void}
     */
    function showFilterResultToast() {
      if (savedFilter.length === 0) {
        showToast('すべてのライブを表示しました');
        return;
      }
      const matched = filterSavedSetlists(loadSavedSetlists(), savedFilter).length;
      showToast(matched === 0 ? '該当するライブはありません' : matched + '件見つかりました');
    }

    /**
     * 条件から曲を1つ外し、残りの条件で検索し直す。
     * 曲一覧の選択状態も揃えるので、検索ポップアップを開き直すと条件と一致する。
     * 最後の1曲を外した場合は絞り込みが無くなり全件表示へ戻る。
     * @param {string} title 条件から外す曲タイトル
     * @returns {void}
     */
    function removeFilterSong(title) {
      const index = savedFilter.indexOf(title);
      if (index === -1) {
        return;
      }
      savedFilter.splice(index, 1);

      const selectedIndex = searchSelection.indexOf(title);
      if (selectedIndex !== -1) {
        searchSelection.splice(selectedIndex, 1);
      }

      renderSavedList();       // 残った条件で絞り込み直す
      updateSearchRunButton(); // 「検索（N曲）」の件数も揃える
      showFilterResultToast();
    }

    /**
     * 曲一覧の1項目の見た目・aria を選択状態に合わせて更新する。
     * 全再描画するとスクロール位置が先頭へ戻るため、トグル時はこれだけを呼ぶ。
     * @param {HTMLButtonElement} button 対象の項目ボタン
     * @param {boolean} selected 選択中なら true
     * @returns {void}
     */
    function updateSearchItem(button, selected) {
      button.classList.toggle('popup__item-button--selected', selected);
      button.setAttribute('aria-pressed', selected ? 'true' : 'false');
      const check = button.querySelector('.popup__item-check');
      if (check) {
        check.textContent = selected ? '✓' : '';
      }
    }

    /**
     * 「検索」ボタンの表示を選択件数に合わせて更新する（未選択時は件数を出さない）。
     * @returns {void}
     */
    function updateSearchRunButton() {
      const runButton = document.getElementById('btn-search-run');
      if (!runButton) {
        return;
      }
      runButton.textContent = searchSelection.length === 0
        ? '検索'
        : '検索（' + searchSelection.length + '曲）';
    }

    /**
     * 検索用の曲一覧（#search-list）を SONG_MASTER のあいうえお順で描画する。
     * 各項目はトグルボタン（aria-pressed）で、タップのたびに選択状態を反転する。
     * 省略名称モード（「曲を選択」と共有）では short 表示＋ボタン詰め表示にする。
     * 曲名は textContent で挿入する（XSS安全）。
     * @returns {void}
     */
    function renderSearchList() {
      const list = document.getElementById('search-list');
      if (!list) {
        return;
      }
      list.textContent = ''; // 全再描画（既存項目をクリア）

      // 省略名称モードでは1行1件のレコード表示をやめ、ボタンを折り返して詰める。
      list.className = popupShortMode ? 'popup__list popup__list--compact' : 'popup__list';

      const songs = getSortedSongMaster();

      if (songs.length === 0) {
        const emptyItem = document.createElement('li');
        emptyItem.className = 'popup__empty';
        emptyItem.textContent = '選択できる曲がありません';
        list.appendChild(emptyItem);
        return;
      }

      const fragment = document.createDocumentFragment();
      songs.forEach(function (song) {
        const title = typeof song.title === 'string' ? song.title : '';
        const selected = isSongSelected(title);

        const item = document.createElement('li');
        item.className = 'popup__item';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'popup__item-button popup__item-button--search';
        button.dataset.role = 'search-option';

        const check = document.createElement('span');
        check.className = 'popup__item-check';
        check.setAttribute('aria-hidden', 'true'); // 状態は aria-pressed で伝える

        const labelText = popupShortMode ? songShortTitle(title) : title;

        const label = document.createElement('span');
        label.className = 'popup__item-title';
        label.textContent = labelText; // textContent で挿入（XSS安全）
        if (labelText !== title) {
          // 省略名称で表示している場合も、支援技術・ツールチップには正式名称を出す。
          button.setAttribute('aria-label', title);
          button.title = title;
        }

        button.appendChild(check);
        button.appendChild(label);
        updateSearchItem(button, selected); // 初期表示（選択中なら塗り＋チェック）

        button.addEventListener('click', function () {
          // トグル: 1回目のタップで選択、もう一度で解除する。
          const nowSelected = toggleSongSelection(title);
          updateSearchItem(button, nowSelected); // 該当項目のみ更新（スクロール維持）
          updateSearchRunButton();
        });

        item.appendChild(button);
        fragment.appendChild(item);
      });
      list.appendChild(fragment);
    }

    /**
     * 曲検索ポップアップを開く（保存一覧ページの上に重ねて表示する）。
     * 直前の選択状態を保ったまま開き直せるよう、選択は破棄しない。
     * @returns {void}
     */
    function openSearchPopup() {
      const overlay = document.getElementById('search-overlay');
      if (!overlay) {
        return;
      }
      syncPopupShortToggle();  // トグルの押下表示を現在のモードへ同期
      renderSearchList();      // 表示直前に最新のマスタ＋選択状態を反映
      updateSearchRunButton();
      overlay.hidden = false;
    }

    /**
     * 曲検索ポップアップを閉じる（選択状態・絞り込みは変更しない）。
     * @returns {void}
     */
    function closeSearchPopup() {
      const overlay = document.getElementById('search-overlay');
      if (!overlay) {
        return;
      }
      overlay.hidden = true;
    }

    /**
     * 選択中の曲で保存一覧を絞り込む（AND 条件）。
     * 未選択のまま検索した場合は絞り込みを解除して全件表示へ戻す。
     * @returns {void}
     */
    function runSearch() {
      savedFilter = searchSelection.slice(); // 押した時点の選択を確定する
      renderSavedList();
      closeSearchPopup();
      showFilterResultToast();
    }

    /**
     * 検索まわり（検索する／検索／閉じる）の結線を行う初期化（冪等）。
     * 曲一覧のトグル結線は renderSearchList、条件チップの解除結線は
     * renderSavedFilter 側で都度行う。
     * @returns {void}
     */
    let savedSearchWired = false;
    function initSavedSearch() {
      if (savedSearchWired) {
        return;
      }
      const openButton = document.getElementById('btn-search-open');
      const runButton = document.getElementById('btn-search-run');
      const closeButton = document.getElementById('btn-search-close');
      const shortToggle = document.getElementById('btn-search-short');

      if (openButton) {
        openButton.addEventListener('click', openSearchPopup);
      }
      if (shortToggle) {
        shortToggle.addEventListener('click', togglePopupShortMode);
      }
      if (runButton) {
        runButton.addEventListener('click', runSearch);
      }
      if (closeButton) {
        closeButton.addEventListener('click', closeSearchPopup);
      }
      savedSearchWired = true;
    }

    // ============================================================
    // Import Confirm Controller: 取り込み前の確認（ImportConfirmController）
    // ------------------------------------------------------------
    // 貼り付けたテキストをどう解釈したか（日付・ライブ名・会場・曲順と区分）を
    // 登録前に見せる。読み取り違いに気づけるようにするのが目的なので、
    // 「登録する」を押すまで保存一覧には何も追加しない。
    // 「戻る」は貼り付けフォームへ戻すだけで、入力した文面はそのまま残す。
    // ============================================================

    /** 確認中の取り込み内容。確認中のみ保持し、登録・中止で null へ戻す。 */
    let pendingConfirm = null;

    /**
     * 確認画面のライブ情報1行を組み立てる。
     * 未入力の項目は「未設定」と薄く出して、空欄と見分けられるようにする。
     * 値は textContent で挿入する（XSS安全）。
     * @param {string} label 項目名
     * @param {string} value 値（空文字なら未設定表示）
     * @returns {HTMLDivElement} 1行分の要素
     */
    function buildConfirmRow(label, value) {
      const row = document.createElement('div');
      row.className = 'confirm-row';

      const term = document.createElement('dt');
      term.className = 'confirm-row__label';
      term.textContent = label;

      const detail = document.createElement('dd');
      detail.className = value === ''
        ? 'confirm-row__value confirm-row__value--empty'
        : 'confirm-row__value';
      detail.textContent = value === '' ? '未設定' : value;

      row.appendChild(term);
      row.appendChild(detail);
      return row;
    }

    /**
     * 確認画面（ライブ情報と曲順）を描画する。
     * 曲順は区分ごとの番号（O.A 1／1／En.1）を付け、曲マスタに無い曲名には
     * 注記を添える（「このまま追加」した曲をここで見直せるようにする）。
     * @returns {void}
     */
    function renderImportConfirm() {
      const info = document.getElementById('confirm-info');
      const count = document.getElementById('confirm-count');
      const songs = document.getElementById('confirm-songs');
      if (!pendingConfirm || !info || !count || !songs) {
        return;
      }

      info.textContent = '';  // 全再描画
      songs.textContent = '';

      info.appendChild(buildConfirmRow('日付', formatDate(pendingConfirm.date)));
      info.appendChild(buildConfirmRow('ライブ名', pendingConfirm.liveName));
      info.appendChild(buildConfirmRow('会場', pendingConfirm.venue));

      const length = pendingConfirm.setlist.length;
      count.textContent = 'セトリ（' + length + '曲）';

      const fragment = document.createDocumentFragment();
      pendingConfirm.setlist.forEach(function (title, index) {
        const position = setlistPosition(
          index, pendingConfirm.oaCount, pendingConfirm.enCount, length
        );

        const item = document.createElement('li');
        item.className = 'confirm-song';

        const no = document.createElement('span');
        no.className = 'confirm-song__no';
        no.textContent = setlistNoLabel(position);

        const name = document.createElement('span');
        name.className = 'confirm-song__title';
        name.textContent = title; // textContent で挿入（XSS安全）

        item.appendChild(no);
        item.appendChild(name);

        if (resolveSongTitle(title) === null) {
          const note = document.createElement('span');
          note.className = 'confirm-song__note';
          note.textContent = '一覧にない曲名';
          item.appendChild(note);
        }

        fragment.appendChild(item);
      });
      songs.appendChild(fragment);
    }

    /**
     * 取り込み確認を開く（この時点ではまだ保存しない）。
     * @param {{date: string, liveName: string, venue: string,
