     *   oaCount: number, enCount: number, setlist: string[]}} source 取り込む内容
     * @returns {void}
     */
    function openImportConfirm(source) {
      const overlay = document.getElementById('confirm-overlay');
      if (!overlay) {
        commitImport(source); // 確認画面が無い場合でも取り込みは進める
        return;
      }
      pendingConfirm = source;
      renderImportConfirm();  // 中身を用意してから表示する
      overlay.hidden = false;
      scrollConfirmTop();     // 非表示の間はスクロール位置を変えられない
    }

    /**
     * 確認画面の本文を先頭までスクロールする。
     * @returns {void}
     */
    function scrollConfirmTop() {
      const body = document.querySelector('#confirm-overlay .popup__body');
      if (body) {
        body.scrollTop = 0;
      }
    }

    /**
     * 取り込み確認を閉じる（確認中の内容は捨てる）。
     * @returns {void}
     */
    function closeImportConfirm() {
      const overlay = document.getElementById('confirm-overlay');
      pendingConfirm = null;
      if (overlay) {
        overlay.hidden = true;
      }
    }

    /**
     * 確認した内容で保存一覧へ登録する。
     * @returns {void}
     */
    function submitImportConfirm() {
      const source = pendingConfirm;
      if (!source) {
        return;
      }
      closeImportConfirm();
      commitImport(source);
    }

    /**
     * 確認をやめて貼り付けフォームへ戻る（文面は残すので直して再実行できる）。
     * @returns {void}
     */
    function cancelImportConfirm() {
      closeImportConfirm();
      showToast('登録をやめました');
    }

    /**
     * 確認画面のボタン（戻る／登録する）を結線する（冪等）。
     * @returns {void}
     */
    let importConfirmWired = false;
    function initImportConfirm() {
      if (importConfirmWired) {
        return;
      }
      const backButton = document.getElementById('btn-confirm-back');
      const submitButton = document.getElementById('btn-confirm-submit');

      if (backButton) {
        backButton.addEventListener('click', cancelImportConfirm);
      }
      if (submitButton) {
        submitButton.addEventListener('click', submitImportConfirm);
      }
      importConfirmWired = true;
    }

    // ============================================================
    // Router: 画面切り替え（Router）
    // ------------------------------------------------------------
    // セトリ作成画面（既定）と保存一覧画面を URL のハッシュで切り替える。
    // 保存一覧は `#saved`。別ページとして扱えるので、ブラウザの戻る／進む・
    // リロード・ブックマーク・リンク共有がそのまま効く。
    // 曲選択／曲検索／曲名確認は一時的な操作なのでポップアップのまま残す。
    // ============================================================

    /** 保存一覧ページを表す URL ハッシュ。 */
    const SAVED_PAGE_HASH = '#saved';

    /** 画面内の「保存一覧」から移動してきたか（「戻る」の挙動を分けるため）。 */
    let enteredSavedPageInApp = false;

    /**
     * 現在の URL ハッシュから表示すべき画面名を返す。
     * 未知のハッシュはメイン画面として扱う。
     * @returns {'main'|'saved'} 画面名
     */
    function currentPageName() {
      return window.location.hash === SAVED_PAGE_HASH ? 'saved' : 'main';
    }

    /**
     * 指定した画面を表示する（もう一方は隠す）。
     * 保存一覧を表示するときは最新の保存データを描画し、離れるときは
     * 取り込みフォームやバックアップパネル、絞り込みを初期化する。
     * @param {'main'|'saved'} name 表示する画面名
     * @returns {void}
     */
    function renderPage(name) {
      const mainPage = document.getElementById('page-main');
      const savedPage = document.getElementById('page-saved');
      if (!mainPage || !savedPage) {
        return;
      }
      const showSaved = name === 'saved';
      mainPage.hidden = showSaved;
      savedPage.hidden = !showSaved;

      if (showSaved) {
        renderSavedList(); // 表示直前に最新の保存データを反映
      } else {
        enteredSavedPageInApp = false;
        leaveSavedPage();
      }
      window.scrollTo(0, 0); // 別ページへ移った体感に合わせて先頭から表示する
    }

    /**
     * 保存一覧ページへ移動する（履歴に積むのでブラウザの戻るで帰れる）。
     * hashchange は次のタスクで発火するため、待たずにその場でも描画する
     * （同じ内容の再描画になるだけなので、後から届く hashchange とも矛盾しない）。
     * @returns {void}
     */
    function goToSavedPage() {
      enteredSavedPageInApp = true;
      window.location.hash = SAVED_PAGE_HASH;
      renderPage(currentPageName());
    }

    /**
     * メイン画面へ戻る。
     * 画面内の操作で保存一覧へ来た場合はブラウザの履歴を1つ戻し、`#saved` を
     * 直接開かれていた場合はハッシュを外す（履歴を無駄に増やさないため）。
     * @returns {void}
     */
    function goBackToMainPage() {
      if (enteredSavedPageInApp) {
        enteredSavedPageInApp = false;
        window.history.back();
      } else {
        window.location.hash = '';
      }
      renderPage('main'); // 履歴の移動を待たずに切り替える（hashchange でも同じ結果になる）
    }

    /**
     * ハッシュ変更の結線と初期表示を行う（冪等）。
     * ブラウザの戻る／進むでも同じ経路（hashchange）で画面が切り替わる。
     * @returns {void}
     */
    let routerWired = false;
    function initRouter() {
      if (routerWired) {
        return;
      }
      window.addEventListener('hashchange', function () {
        renderPage(currentPageName());
      });
      routerWired = true;
      renderPage(currentPageName()); // リロード・直リンクでも現在のハッシュに従う
    }

    // ============================================================
    // Bootstrap: DOM取得・イベント結線・初期描画（タスク4.1 / design Bootstrap）
    // ------------------------------------------------------------
    // 責務（Requirements 1.2, 1.3, 5.1, 5.5–5.7 / design「テキスト生成とコピー」）:
    //   - 日付／ライブ名／会場名の入力を state へ反映（input イベント）。
    //   - コピーボタンのタップで buildOutputText(state) → copyToClipboard(text)、
    //     戻り値（boolean）に応じて成功／失敗トーストを表示。
    //   - 起動時に renderAll() で初期描画し、メイン画面を動作可能状態にする。
    // 二重結線回避: 追加／閉じるボタンのポップアップ開閉は 3.1 の initAddSongPopup()
    //   が addSongPopupWired フラグで冪等結線する。ここでは initAddSongPopup() を
    //   呼ぶのみで（既に結線済みなら no-op）、ポップアップ開閉を再結線しない。
    //   入力欄・コピーボタンの結線も bootstrap 自体を一度だけ実行することで多重登録を防ぐ。
    // ============================================================

    /** コピー成功／失敗時の通知文（Requirements 5.6, 5.7）。 */
    const COPY_SUCCESS_MESSAGE = 'コピーしました';
    const COPY_FAILURE_MESSAGE = 'コピーに失敗しました';

    /**
     * ライブ情報入力欄（日付・ライブ名・会場名）を state へ結線する（1.2, 1.3）。
     * input イベントで入力値を逐次 state へ反映する（state を唯一の真実とする）。
     * テキスト生成は state を参照するため、出力時に常に最新値が使われる。
     * @returns {void}
     */
    /**
     * ローカルの今日を <input type="date"> 用の YYYY-MM-DD 文字列で返す。
     * @returns {string}
     */
    function todayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd;
    }

    function initLiveInfoInputs() {
      const dateInput = document.getElementById('input-date');
      const liveNameInput = document.getElementById('input-live-name');
      const venueInput = document.getElementById('input-venue');
      const memoInput = document.getElementById('input-memo');

      if (dateInput) {
        // 初期値: アクセス日（ローカルの今日）を YYYY-MM-DD で設定（未入力時のみ）
        if (!dateInput.value) {
          dateInput.value = todayString();
        }
        state.date = dateInput.value;
        dateInput.addEventListener('input', function () {
          state.date = dateInput.value;
          saveState(); // 入力欄は renderAll を呼ばないためここで保存
        });
      }
      if (liveNameInput) {
        liveNameInput.addEventListener('input', function () {
          state.liveName = liveNameInput.value;
          saveState();
        });
      }
      if (venueInput) {
        venueInput.addEventListener('input', function () {
          state.venue = venueInput.value;
          saveState();
        });
      }
      if (memoInput) {
        memoInput.addEventListener('input', function () {
          state.memo = memoInput.value;
          saveState();
        });
      }
    }

    /**
     * コピーボタン（#btn-copy）を結線する（5.1, 5.5–5.7）。
     * タップで最新 state から buildOutputText → copyToClipboard を実行し、
     * 解決した真偽値に応じて成功／失敗トーストを表示する。
     * @returns {void}
     */
    function initCopyAction() {
      const copyButton = document.getElementById('btn-copy');
      if (!copyButton) {
        return;
      }
      copyButton.addEventListener('click', async function () {
        const text = buildOutputText(state);     // 最新 state から生成（5.2）
        const succeeded = await copyToClipboard(text); // API→フォールバック（5.5）
        showToast(succeeded ? COPY_SUCCESS_MESSAGE : COPY_FAILURE_MESSAGE);
      });
    }

    /**
     * リセットボタン（#btn-reset）を結線する。
     * タップで確認ダイアログを出し、承諾時のみ全状態を初期化する（全削除）。
     * state と入力欄（日付・ライブ名・会場名）の両方をクリアし、renderAll で再描画する。
     * @returns {void}
     */
    function initResetAction() {
      const resetButton = document.getElementById('btn-reset');
      if (!resetButton) {
        return;
      }
      resetButton.addEventListener('click', function () {
        // 破壊的操作のため確認（誤タップ防止）。承諾しなければ何もしない。
        if (!window.confirm('セトリと入力内容をすべて削除します。よろしいですか？')) {
          return;
        }
        resetState(); // 状態をクリア（DOM には触れない）

        // 入力欄の表示値も state に合わせて更新する。
        // 日付だけは空ではなく本日へ戻し、state.date も同期する。
        const dateInput = document.getElementById('input-date');
        const liveNameInput = document.getElementById('input-live-name');
        const venueInput = document.getElementById('input-venue');
        const memoInput = document.getElementById('input-memo');
        if (dateInput) {
          dateInput.value = todayString();
          state.date = dateInput.value;
        }
        if (liveNameInput) {
          liveNameInput.value = '';
        }
        if (venueInput) {
          venueInput.value = '';
        }
        if (memoInput) {
          memoInput.value = '';
        }

        renderAll();     // セトリ表を空状態へ再描画
        syncEditingUi(); // 編集中の紐づけも解除された状態へ表示を戻す
        showToast('すべて削除しました');
      });
    }

    /**
     * 復元した state を入力欄（日付・ライブ名・会場名）へ反映する。
     * 日付が空なら本日を既定値にし、state.date も同期する。
     * loadState() の直後・入力結線の前に呼ぶことで、初期化処理が復元値を
     * 上書きしないようにする。
     * @returns {void}
     */
    function applyStateToInputs() {
      const dateInput = document.getElementById('input-date');
      const liveNameInput = document.getElementById('input-live-name');
      const venueInput = document.getElementById('input-venue');
      const memoInput = document.getElementById('input-memo');
      if (dateInput) {
        dateInput.value = state.date || todayString();
        state.date = dateInput.value;
      }
      if (liveNameInput) {
        liveNameInput.value = state.liveName;
      }
      if (venueInput) {
        venueInput.value = state.venue;
      }
      if (memoInput) {
        memoInput.value = state.memo;
      }
    }

    /**
     * アプリ起動時の一括初期化（一度だけ実行）。
     * 保存データを復元 → 入力欄へ反映 → 各種結線 → 初期描画の順で実行する。
     * ポップアップ開閉の結線は冪等な initAddSongPopup() に委譲（再結線しない）。
     * @returns {void}
     */
    let appBootstrapped = false;
    function bootstrap() {
      if (appBootstrapped) {
        return;
      }
      appBootstrapped = true;

      loadState();           // 保存データを復元（間違って閉じても直前の内容へ）
      applyStateToInputs();  // 復元値を入力欄へ反映（日付未設定なら本日）
      initLiveInfoInputs();  // 入力反映（1.2, 1.3）
      initCopyAction();      // コピー結線（5.1, 5.5–5.7）
      initResetAction();     // リセット（全削除）結線
      initAddSongPopup();    // ポップアップ開閉（冪等。既に結線済みなら no-op）
      initSectionTools();    // ＋O.A／＋アンコールの結線（冪等）
      initSavedSetlist();    // DBに追加／保存一覧の結線（冪等）
      initSavedSearch();     // 曲での絞り込み検索の結線（冪等）
      initSavedBackup();     // 保存データの書き出し／取り込みの結線（冪等）
      initImportResolve();   // 取り込み時の曲名確認の結線（冪等）
      initImportConfirm();   // 取り込み前の確認画面の結線（冪等）
      renderAll();           // 初期描画（メイン画面を動作可能状態に）
      syncEditingUi();       // 編集中だった場合は帯と保存ボタンを復元
      initRouter();          // ハッシュに応じた画面表示（#saved なら保存一覧ページ）
    }

    // DOM 構築タイミングに依存しないよう、状態に応じて即時／DOMContentLoaded で一度だけ実行。
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
</script>
</body>
</html>
